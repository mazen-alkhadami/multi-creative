<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141215" />
      <stop offset="100%" stop-color="#0A080B" />
    </linearGradient>
    <linearGradient id="fireGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <filter id="shadow4" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bgGrad4)" />
  <circle cx="850" cy="300" r="280" fill="#EA580C" opacity="0.05" filter="blur(60px)" />
  <circle cx="350" cy="550" r="250" fill="#C6A66B" opacity="0.04" filter="blur(50px)" />

  <!-- Presentation Stage with 3 Social Media / Ad Banners -->
  <g filter="url(#shadow4)" transform="translate(120, 90)">
    <!-- Base Canvas -->
    <rect width="960" height="620" rx="16" fill="#1A181C" stroke="#2D2830" stroke-width="1.5" />
    
    <text x="50" y="55" font-family="sans-serif" font-size="18" font-weight="bold" fill="#F5F1E8">URBAN BISTRO — CAMPAIGN SUITE</text>
    <text x="50" y="80" font-family="sans-serif" font-size="12" fill="#8E8594">سلسلة تصاميم وبوسترات إعلانية لمنصات التواصل الاجتماعي وحملات الإطلاق</text>

    <!-- 3 Phone / Story Frames -->
    <!-- Frame 1 -->
    <g transform="translate(60, 110)">
      <rect width="250" height="450" rx="24" fill="#0E0D10" stroke="#3A3340" stroke-width="3" />
      <!-- Story Content -->
      <rect x="15" y="20" width="220" height="410" rx="16" fill="#1F1B22" />
      <circle cx="125" cy="140" r="60" fill="url(#fireGrad4)" opacity="0.2" />
      <!-- Stylized Burger / Dish Vector -->
      <ellipse cx="125" cy="130" rx="45" ry="20" fill="#EA580C" />
      <rect x="85" y="135" width="80" height="15" rx="4" fill="#F59E0B" />
      <ellipse cx="125" cy="155" rx="45" ry="18" fill="#78350F" />
      <text x="125" y="230" font-family="sans-serif" font-size="20" font-weight="900" fill="#FFF" text-anchor="middle">نكهة لا تُنسى</text>
      <text x="125" y="260" font-family="sans-serif" font-size="11" fill="#C6A66B" text-anchor="middle">عرض الافتتاح الخاص</text>
      <rect x="55" y="320" width="140" height="34" rx="17" fill="url(#fireGrad4)" />
      <text x="125" y="342" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFF" text-anchor="middle">اطلب الآن</text>
    </g>

    <!-- Frame 2 (Featured Center) -->
    <g transform="translate(355, 100)">
      <rect width="250" height="465" rx="24" fill="#131017" stroke="#C6A66B" stroke-width="2" />
      <rect x="15" y="20" width="220" height="425" rx="16" fill="#191520" />
      <!-- Stylized Coffee / Beverage -->
      <circle cx="125" cy="150" r="65" fill="#C6A66B" opacity="0.15" />
      <rect x="95" y="100" width="60" height="90" rx="8" fill="#C6A66B" fill-opacity="0.3" stroke="#C6A66B" stroke-width="1.5" />
      <line x1="85" y1="190" x2="165" y2="190" stroke="#C6A66B" stroke-width="2" />
      <text x="125" y="240" font-family="sans-serif" font-size="22" font-weight="900" fill="#F5F1E8" text-anchor="middle">مشروبات الصيف</text>
      <text x="125" y="270" font-family="sans-serif" font-size="12" fill="#E2C58A" text-anchor="middle">انتعاش يدوم طوال اليوم</text>
      <rect x="55" y="335" width="140" height="34" rx="17" fill="#C6A66B" />
      <text x="125" y="357" font-family="sans-serif" font-size="11" font-weight="bold" fill="#111" text-anchor="middle">اكتشف القائمة</text>
    </g>

    <!-- Frame 3 -->
    <g transform="translate(650, 110)">
      <rect width="250" height="450" rx="24" fill="#0E0D10" stroke="#3A3340" stroke-width="3" />
      <rect x="15" y="20" width="220" height="410" rx="16" fill="#1F1B22" />
      <circle cx="125" cy="140" r="60" fill="#10B981" opacity="0.15" />
      <circle cx="125" cy="140" r="40" fill="none" stroke="#10B981" stroke-width="2" stroke-dasharray="6 3" />
      <text x="125" y="145" font-family="sans-serif" font-size="14" font-weight="bold" fill="#10B981" text-anchor="middle">50% خصم</text>
      <text x="125" y="230" font-family="sans-serif" font-size="20" font-weight="900" fill="#FFF" text-anchor="middle">عرض نهاية الأسبوع</text>
      <text x="125" y="260" font-family="sans-serif" font-size="11" fill="#A0A0A0" text-anchor="middle">على جميع الطلبات العائلية</text>
      <rect x="55" y="320" width="140" height="34" rx="17" fill="#10B981" />
      <text x="125" y="342" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFF" text-anchor="middle">استفد من العرض</text>
    </g>
  </g>

  <!-- Concept Badge Overlay -->
  <g transform="translate(150, 725)">
    <rect width="180" height="32" rx="16" fill="#EA580C" fill-opacity="0.15" stroke="#EA580C" stroke-width="1" />
    <circle cx="20" cy="16" r="4" fill="#00F0FF" />
    <text x="35" y="21" font-family="sans-serif" font-size="12" font-weight="bold" fill="#EA580C">عمل تجريبي • Concept Demo</text>
  </g>
</svg>
