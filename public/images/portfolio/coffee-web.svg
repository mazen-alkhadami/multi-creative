<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="100%" stop-color="#0A0A0A" />
    </linearGradient>
    <linearGradient id="goldGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2C58A" />
      <stop offset="100%" stop-color="#C6A66B" />
    </linearGradient>
    <linearGradient id="screenGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1C1A" />
      <stop offset="100%" stop-color="#141312" />
    </linearGradient>
    <filter id="shadow1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bgGrad1)" />
  <circle cx="950" cy="200" r="300" fill="#C6A66B" opacity="0.06" filter="blur(50px)" />
  <circle cx="250" cy="650" r="250" fill="#00F0FF" opacity="0.04" filter="blur(60px)" />

  <!-- Browser Window Mockup -->
  <g filter="url(#shadow1)">
    <!-- Browser Chrome Frame -->
    <rect x="120" y="90" width="960" height="620" rx="16" fill="#1C1B19" stroke="#C6A66B" stroke-opacity="0.3" stroke-width="1.5" />
    
    <!-- Titlebar -->
    <rect x="120" y="90" width="960" height="44" rx="16" fill="#252320" />
    <rect x="120" y="120" width="960" height="14" fill="#252320" />
    <circle cx="150" cy="112" r="6" fill="#EF4444" opacity="0.8" />
    <circle cx="170" cy="112" r="6" fill="#F59E0B" opacity="0.8" />
    <circle cx="190" cy="112" r="6" fill="#10B981" opacity="0.8" />
    <rect x="230" y="102" width="450" height="20" rx="6" fill="#141312" stroke="#333" stroke-width="1" />
    <text x="245" y="116" font-family="sans-serif" font-size="11" fill="#888">https://aura-specialty-coffee.com</text>

    <!-- Webpage Content -->
    <g transform="translate(120, 134)">
      <rect width="960" height="576" fill="url(#screenGrad1)" />
      
      <!-- Navbar -->
      <line x1="0" y1="60" x2="960" y2="60" stroke="#332E27" stroke-width="1" />
      <text x="50" y="38" font-family="sans-serif" font-size="18" font-weight="900" fill="url(#goldGrad1)" letter-spacing="2">AURA COFFEE</text>
      <rect x="780" y="20" width="130" height="28" rx="14" fill="url(#goldGrad1)" />
      <text x="815" y="38" font-family="sans-serif" font-size="11" font-weight="bold" fill="#111">تسوق الآن</text>

      <!-- Hero Section Grid -->
      <!-- Left text -->
      <rect x="50" y="100" width="120" height="22" rx="11" fill="#C6A66B" fill-opacity="0.15" />
      <text x="65" y="115" font-family="sans-serif" font-size="10" font-weight="bold" fill="#C6A66B">موسم المحاصيل النادرة</text>
      <text x="50" y="170" font-family="sans-serif" font-size="34" font-weight="bold" fill="#F5F1E8">مذاق القهوة المختصة</text>
      <text x="50" y="215" font-family="sans-serif" font-size="34" font-weight="bold" fill="url(#goldGrad1)">بأعلى معايير الإيحاء</text>
      <text x="50" y="260" font-family="sans-serif" font-size="14" fill="#A09A90">حبوب قهوة كولومبية وإثيوبية مجففة ومحمصة يدوياً بعناية فائقة.</text>
      
      <!-- Product Card 1 -->
      <rect x="50" y="320" width="180" height="200" rx="12" fill="#252320" stroke="#3D372E" stroke-width="1" />
      <rect x="75" y="340" width="130" height="100" rx="8" fill="#181715" />
      <circle cx="140" cy="390" r="30" fill="#C6A66B" fill-opacity="0.2" />
      <text x="70" y="465" font-family="sans-serif" font-size="12" font-weight="bold" fill="#F5F1E8">إثيوبيا قوجي 250g</text>
      <text x="70" y="490" font-family="sans-serif" font-size="11" fill="#C6A66B">إيحاء ياسمين وتوت</text>

      <!-- Product Card 2 -->
      <rect x="250" y="320" width="180" height="200" rx="12" fill="#252320" stroke="#3D372E" stroke-width="1" />
      <rect x="275" y="340" width="130" height="100" rx="8" fill="#181715" />
      <circle cx="340" cy="390" r="30" fill="#C6A66B" fill-opacity="0.2" />
      <text x="270" y="465" font-family="sans-serif" font-size="12" font-weight="bold" fill="#F5F1E8">كولومبيا هويلا 250g</text>
      <text x="270" y="490" font-family="sans-serif" font-size="11" fill="#C6A66B">إيحاء كراميل ومكسرات</text>

      <!-- Right Visual Feature (Mockup Bag Graphic) -->
      <rect x="520" y="100" width="390" height="420" rx="16" fill="#181614" stroke="#C6A66B" stroke-opacity="0.2" stroke-width="1" />
      <!-- Stylized Coffee Pouch -->
      <path d="M640,160 L780,160 L800,430 L620,430 Z" fill="#282420" stroke="#C6A66B" stroke-width="2" />
      <rect x="660" y="240" width="100" height="120" rx="6" fill="#181715" stroke="#C6A66B" stroke-width="1" />
      <circle cx="710" cy="285" r="20" fill="url(#goldGrad1)" />
      <text x="680" y="335" font-family="sans-serif" font-size="11" font-weight="bold" fill="#F5F1E8" text-anchor="middle">AURA RESERVE</text>
    </g>
  </g>

  <!-- Concept Badge Overlay -->
  <g transform="translate(150, 725)">
    <rect width="180" height="32" rx="16" fill="#C6A66B" fill-opacity="0.15" stroke="#C6A66B" stroke-width="1" />
    <circle cx="20" cy="16" r="4" fill="#00F0FF" />
    <text x="35" y="21" font-family="sans-serif" font-size="12" font-weight="bold" fill="#C6A66B">عمل تجريبي • Concept Demo</text>
  </g>
</svg>
