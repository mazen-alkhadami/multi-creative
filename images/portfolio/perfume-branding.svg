<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161413" />
      <stop offset="100%" stop-color="#0D0B0A" />
    </linearGradient>
    <linearGradient id="goldLuxury3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D8A7" />
      <stop offset="50%" stop-color="#C6A66B" />
      <stop offset="100%" stop-color="#9E8045" />
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bgGrad3)" />
  <circle cx="600" cy="400" r="350" fill="#C6A66B" opacity="0.04" filter="blur(60px)" />

  <!-- Brand Presentation Moodboard Frame -->
  <g filter="url(#shadow3)">
    <rect x="120" y="90" width="960" height="620" rx="16" fill="#1C1A18" stroke="#332E27" stroke-width="1.5" />
    
    <!-- Top Header of Brand Board -->
    <rect x="120" y="90" width="960" height="70" rx="16" fill="#221F1C" />
    <text x="160" y="132" font-family="serif" font-size="20" font-weight="bold" fill="url(#goldLuxury3)" letter-spacing="4">MISK LUXURY PERFUMES</text>
    <text x="880" y="132" font-family="sans-serif" font-size="12" fill="#8C8274" letter-spacing="2">BRAND IDENTITY GUIDELINES</text>

    <!-- Content Columns -->
    <g transform="translate(120, 160)">
      <!-- Left Column: Primary Logo Emblem & Typography -->
      <g transform="translate(40, 30)">
        <rect width="420" height="240" rx="12" fill="#151312" stroke="#2B2620" stroke-width="1" />
        <!-- Emblem -->
        <circle cx="210" cy="95" r="45" fill="none" stroke="url(#goldLuxury3)" stroke-width="2" />
        <circle cx="210" cy="95" r="35" fill="none" stroke="url(#goldLuxury3)" stroke-width="1" stroke-dasharray="4 2" />
        <path d="M210,65 L215,95 L225,95 L217,102 L220,120 L210,108 L200,120 L203,102 L195,95 L205,95 Z" fill="url(#goldLuxury3)" />
        <text x="210" y="170" font-family="serif" font-size="22" font-weight="bold" fill="url(#goldLuxury3)" text-anchor="middle" letter-spacing="4">مسك • MISK</text>
        <text x="210" y="195" font-family="sans-serif" font-size="10" fill="#999" text-anchor="middle" letter-spacing="2">HAUTE PARFUMERIE</text>

        <!-- Color Palette Swatches -->
        <g transform="translate(0, 260)">
          <rect width="420" height="190" rx="12" fill="#151312" stroke="#2B2620" stroke-width="1" />
          <text x="20" y="30" font-family="sans-serif" font-size="11" font-weight="bold" fill="#8C8274">نظام الألوان المعتمد (COLOR TOKENS)</text>
          
          <rect x="20" y="45" width="85" height="110" rx="8" fill="#0D0B0A" stroke="#333" stroke-width="1" />
          <text x="28" y="135" font-family="sans-serif" font-size="9" fill="#999">Obsidian</text>
          <text x="28" y="148" font-family="sans-serif" font-size="8" fill="#666">#0D0B0A</text>

          <rect x="115" y="45" width="85" height="110" rx="8" fill="#C6A66B" />
          <text x="123" y="135" font-family="sans-serif" font-size="9" font-weight="bold" fill="#111">Champagne</text>
          <text x="123" y="148" font-family="sans-serif" font-size="8" fill="#333">#C6A66B</text>

          <rect x="210" y="45" width="85" height="110" rx="8" fill="#F5F1E8" />
          <text x="218" y="135" font-family="sans-serif" font-size="9" font-weight="bold" fill="#111">Warm Ivory</text>
          <text x="218" y="148" font-family="sans-serif" font-size="8" fill="#444">#F5F1E8</text>

          <rect x="305" y="45" width="85" height="110" rx="8" fill="#3D3328" />
          <text x="313" y="135" font-family="sans-serif" font-size="9" fill="#FFF">Bronze Velvet</text>
          <text x="313" y="148" font-family="sans-serif" font-size="8" fill="#AAA">#3D3328</text>
        </g>
      </g>

      <!-- Right Column: Perfume Bottle Mockup Representation -->
      <g transform="translate(500, 30)">
        <rect width="420" height="450" rx="12" fill="#151312" stroke="#2B2620" stroke-width="1" />
        <!-- Bottle Silhouette -->
        <g transform="translate(130, 40)">
          <!-- Glass Cap -->
          <rect x="40" y="10" width="80" height="40" rx="4" fill="url(#goldLuxury3)" stroke="#A0854E" stroke-width="1.5" />
          <!-- Neck -->
          <rect x="60" y="50" width="40" height="15" fill="#E2C58A" />
          <!-- Bottle Body -->
          <rect x="0" y="65" width="160" height="250" rx="14" fill="#201C18" stroke="url(#goldLuxury3)" stroke-width="2" />
          <!-- Label on Bottle -->
          <rect x="25" y="120" width="110" height="140" rx="6" fill="#12100E" stroke="#C6A66B" stroke-width="1" />
          <circle cx="80" cy="155" r="16" fill="none" stroke="url(#goldLuxury3)" stroke-width="1" />
          <text x="80" y="190" font-family="serif" font-size="14" font-weight="bold" fill="url(#goldLuxury3)" text-anchor="middle" letter-spacing="2">MISK</text>
          <text x="80" y="210" font-family="sans-serif" font-size="8" fill="#AAA" text-anchor="middle">EAU DE PARFUM</text>
          <text x="80" y="235" font-family="sans-serif" font-size="7" fill="#C6A66B" text-anchor="middle">100 ML • 3.4 FL.OZ</text>
        </g>
        <text x="210" y="420" font-family="sans-serif" font-size="11" fill="#8C8274" text-anchor="middle">نموذج العبوة والملصق التجاري الفاخر</text>
      </g>
    </g>
  </g>

  <!-- Concept Badge Overlay -->
  <g transform="translate(150, 725)">
    <rect width="180" height="32" rx="16" fill="#C6A66B" fill-opacity="0.15" stroke="#C6A66B" stroke-width="1" />
    <circle cx="20" cy="16" r="4" fill="#00F0FF" />
    <text x="35" y="21" font-family="sans-serif" font-size="12" font-weight="bold" fill="#C6A66B">عمل تجريبي • Concept Demo</text>
  </g>
</svg>
