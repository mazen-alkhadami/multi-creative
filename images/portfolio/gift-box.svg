<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121316" />
      <stop offset="100%" stop-color="#090A0D" />
    </linearGradient>
    <linearGradient id="goldBox6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D8A7" />
      <stop offset="50%" stop-color="#C6A66B" />
      <stop offset="100%" stop-color="#9E8045" />
    </linearGradient>
    <filter id="shadow6" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bgGrad6)" />
  <circle cx="600" cy="400" r="320" fill="#C6A66B" opacity="0.04" filter="blur(60px)" />

  <!-- Gift Box Mockup Canvas -->
  <g filter="url(#shadow6)" transform="translate(120, 90)">
    <rect width="960" height="620" rx="16" fill="#18191E" stroke="#2B2D38" stroke-width="1.5" />
    
    <text x="50" y="55" font-family="sans-serif" font-size="18" font-weight="bold" fill="#F5F1E8">EXECUTIVE WELCOME GIFT BOX</text>
    <text x="50" y="80" font-family="sans-serif" font-size="12" fill="#888B99">صندوق هدايا ترحيبية فاخرة يشمل أجندة جلدية، قلم حبر معدني، وفلاش ميموري بتغليف مخصص</text>

    <!-- Main Rigid Gift Box (Open View) -->
    <g transform="translate(140, 110)">
      <!-- Outer Box Base -->
      <rect width="680" height="460" rx="16" fill="#111215" stroke="url(#goldBox6)" stroke-width="2" />
      
      <!-- Inner Foam Inset -->
      <rect x="25" y="25" width="630" height="410" rx="10" fill="#0C0D10" stroke="#222530" stroke-width="1.5" />
      
      <!-- Item 1: Leather Notebook (Left) -->
      <g transform="translate(60, 50)">
        <rect width="220" height="360" rx="8" fill="#1C1E26" stroke="#C6A66B" stroke-width="1" />
        <!-- Embossed Pattern on Notebook -->
        <rect x="25" y="140" width="170" height="80" rx="4" fill="none" stroke="url(#goldBox6)" stroke-width="1.5" />
        <circle cx="110" cy="170" r="14" fill="none" stroke="url(#goldBox6)" stroke-width="1" />
        <text x="110" y="202" font-family="serif" font-size="10" font-weight="bold" fill="url(#goldBox6)" text-anchor="middle" letter-spacing="2">EXECUTIVE</text>
        <line x1="20" y1="20" x2="20" y2="340" stroke="#333745" stroke-width="2" />
      </g>

      <!-- Item 2: Luxury Metal Pen (Center) -->
      <g transform="translate(325, 50)">
        <rect width="90" height="360" rx="8" fill="#101115" stroke="#1D202A" stroke-width="1" />
        <!-- Pen Body -->
        <rect x="38" y="40" width="14" height="280" rx="7" fill="url(#goldBox6)" />
        <rect x="36" y="90" width="18" height="8" rx="2" fill="#222" />
        <rect x="42" y="50" width="6" height="60" rx="2" fill="#111" />
      </g>

      <!-- Item 3: Custom USB Flash Drive & Metal Badge (Right) -->
      <g transform="translate(450, 50)">
        <!-- USB Key -->
        <rect width="180" height="160" rx="8" fill="#14151B" stroke="#252835" stroke-width="1" />
        <rect x="50" y="45" width="80" height="70" rx="6" fill="#242733" stroke="url(#goldBox6)" stroke-width="1" />
        <rect x="75" y="30" width="30" height="15" fill="#888" />
        <text x="90" y="85" font-family="sans-serif" font-size="9" font-weight="bold" fill="url(#goldBox6)" text-anchor="middle">64 GB</text>

        <!-- Executive Cardholder / Metal Badge -->
        <g transform="translate(0, 190)">
          <rect width="180" height="170" rx="8" fill="#14151B" stroke="#252835" stroke-width="1" />
          <rect x="25" y="30" width="130" height="110" rx="6" fill="#1B1D25" stroke="#C6A66B" stroke-width="1" />
          <circle cx="90" cy="75" r="18" fill="url(#goldBox6)" />
          <text x="90" y="115" font-family="sans-serif" font-size="9" fill="#FFF" text-anchor="middle">MEMBERSHIP</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Concept Badge Overlay -->
  <g transform="translate(150, 725)">
    <rect width="180" height="32" rx="16" fill="#C6A66B" fill-opacity="0.15" stroke="#C6A66B" stroke-width="1" />
    <circle cx="20" cy="16" r="4" fill="#00F0FF" />
    <text x="35" y="21" font-family="sans-serif" font-size="12" font-weight="bold" fill="#C6A66B">عمل تجريبي • Concept Demo</text>
  </g>
</svg>
