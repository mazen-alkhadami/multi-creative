<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1117" />
      <stop offset="100%" stop-color="#07090E" />
    </linearGradient>
    <linearGradient id="accentGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bgGrad2)" />
  <circle cx="1000" cy="180" r="280" fill="#00F0FF" opacity="0.05" filter="blur(60px)" />
  <circle cx="200" cy="650" r="260" fill="#C6A66B" opacity="0.04" filter="blur(50px)" />

  <!-- App Dashboard Frame -->
  <g filter="url(#shadow2)">
    <rect x="120" y="90" width="960" height="620" rx="16" fill="#131722" stroke="#252D40" stroke-width="1.5" />
    
    <!-- Top Bar -->
    <rect x="120" y="90" width="960" height="50" rx="16" fill="#181E2C" />
    <rect x="120" y="125" width="960" height="15" fill="#181E2C" />
    <circle cx="150" cy="115" r="5" fill="#EF4444" />
    <circle cx="168" cy="115" r="5" fill="#F59E0B" />
    <circle cx="186" cy="115" r="5" fill="#10B981" />
    <text x="220" y="120" font-family="sans-serif" font-size="13" font-weight="bold" fill="#00F0FF">NOVA WORKSPACE</text>
    <rect x="850" y="103" width="100" height="24" rx="12" fill="#00F0FF" fill-opacity="0.15" stroke="#00F0FF" stroke-width="1" />
    <text x="872" y="119" font-family="sans-serif" font-size="11" font-weight="bold" fill="#00F0FF">+ مهمة جديدة</text>

    <!-- Main Workspace Content -->
    <g transform="translate(120, 140)">
      <!-- Sidebar -->
      <rect width="180" height="570" fill="#10141E" />
      <line x1="180" y1="0" x2="180" y2="570" stroke="#1F2637" stroke-width="1" />
      <rect x="15" y="25" width="150" height="32" rx="8" fill="#1F283D" />
      <text x="45" y="46" font-family="sans-serif" font-size="12" font-weight="bold" fill="#38BDF8">لوحة المشاريع</text>
      <text x="45" y="90" font-family="sans-serif" font-size="12" fill="#718096">فريق التصميم</text>
      <text x="45" y="130" font-family="sans-serif" font-size="12" fill="#718096">فريق البرمجة</text>
      <text x="45" y="170" font-family="sans-serif" font-size="12" fill="#718096">التقارير والإحصاء</text>

      <!-- Main Board Content -->
      <!-- KPI Stats Row -->
      <g transform="translate(205, 20)">
        <rect width="230" height="90" rx="12" fill="#181E2C" stroke="#252D40" stroke-width="1" />
        <text x="20" y="30" font-family="sans-serif" font-size="11" fill="#718096">إجمالي المهام المنجزة</text>
        <text x="20" y="65" font-family="sans-serif" font-size="28" font-weight="bold" fill="#F8FAFC">142</text>
        <rect x="160" y="20" width="50" height="20" rx="10" fill="#10B981" fill-opacity="0.2" />
        <text x="170" y="34" font-family="sans-serif" font-size="10" font-weight="bold" fill="#10B981">+24%</text>

        <rect x="250" y="0" width="230" height="90" rx="12" fill="#181E2C" stroke="#252D40" stroke-width="1" />
        <text x="270" y="30" font-family="sans-serif" font-size="11" fill="#718096">المشاريع النشطة</text>
        <text x="270" y="65" font-family="sans-serif" font-size="28" font-weight="bold" fill="#38BDF8">8 مشاريع</text>

        <rect x="500" y="0" width="230" height="90" rx="12" fill="#181E2C" stroke="#252D40" stroke-width="1" />
        <text x="520" y="30" font-family="sans-serif" font-size="11" fill="#718096">معدل الإنجاز الزمني</text>
        <text x="520" y="65" font-family="sans-serif" font-size="28" font-weight="bold" fill="#10B981">98.2%</text>
      </g>

      <!-- Kanban Columns -->
      <g transform="translate(205, 130)">
        <!-- Column 1: قيد التنفيذ -->
        <rect width="235" height="400" rx="12" fill="#141824" stroke="#1F2637" stroke-width="1" />
        <text x="15" y="30" font-family="sans-serif" font-size="12" font-weight="bold" fill="#F8FAFC">قيد العمل (3)</text>
        <!-- Card A -->
        <rect x="12" y="45" width="210" height="95" rx="8" fill="#1B2233" stroke="#28334D" stroke-width="1" />
        <rect x="22" y="58" width="55" height="18" rx="4" fill="#38BDF8" fill-opacity="0.2" />
        <text x="28" y="71" font-family="sans-serif" font-size="9" font-weight="bold" fill="#38BDF8">تصميم</text>
        <text x="22" y="98" font-family="sans-serif" font-size="12" font-weight="bold" fill="#E2E8F0">تحديث واجهة التطبيق</text>
        <!-- Card B -->
        <rect x="12" y="150" width="210" height="95" rx="8" fill="#1B2233" stroke="#28334D" stroke-width="1" />
        <rect x="22" y="163" width="60" height="18" rx="4" fill="#10B981" fill-opacity="0.2" />
        <text x="28" y="176" font-family="sans-serif" font-size="9" font-weight="bold" fill="#10B981">برمجة</text>
        <text x="22" y="203" font-family="sans-serif" font-size="12" font-weight="bold" fill="#E2E8F0">ربط الـ API وإشعارات</text>

        <!-- Column 2: مراجعة الجودة -->
        <g transform="translate(248, 0)">
          <rect width="235" height="400" rx="12" fill="#141824" stroke="#1F2637" stroke-width="1" />
          <text x="15" y="30" font-family="sans-serif" font-size="12" font-weight="bold" fill="#F8FAFC">المراجعة والتدقيق (2)</text>
          <rect x="12" y="45" width="210" height="95" rx="8" fill="#1B2233" stroke="#28334D" stroke-width="1" />
          <rect x="22" y="58" width="50" height="18" rx="4" fill="#F59E0B" fill-opacity="0.2" />
          <text x="28" y="71" font-family="sans-serif" font-size="9" font-weight="bold" fill="#F59E0B">تدقيق</text>
          <text x="22" y="98" font-family="sans-serif" font-size="12" font-weight="bold" fill="#E2E8F0">اختبار الأداء والسرعة</text>
        </g>

        <!-- Column 3: المكتملة -->
        <g transform="translate(496, 0)">
          <rect width="235" height="400" rx="12" fill="#141824" stroke="#1F2637" stroke-width="1" />
          <text x="15" y="30" font-family="sans-serif" font-size="12" font-weight="bold" fill="#10B981">مكتملة هذا الأسبوع (5)</text>
          <rect x="12" y="45" width="210" height="95" rx="8" fill="#1B2233" stroke="#28334D" stroke-width="1" />
          <rect x="22" y="58" width="60" height="18" rx="4" fill="#10B981" fill-opacity="0.2" />
          <text x="28" y="71" font-family="sans-serif" font-size="9" font-weight="bold" fill="#10B981">منجز</text>
          <text x="22" y="98" font-family="sans-serif" font-size="12" font-weight="bold" fill="#E2E8F0">إطلاق الإصدار التجريبي</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Concept Badge Overlay -->
  <g transform="translate(150, 725)">
    <rect width="180" height="32" rx="16" fill="#38BDF8" fill-opacity="0.15" stroke="#38BDF8" stroke-width="1" />
    <circle cx="20" cy="16" r="4" fill="#00F0FF" />
    <text x="35" y="21" font-family="sans-serif" font-size="12" font-weight="bold" fill="#38BDF8">عمل تجريبي • Concept Demo</text>
  </g>
</svg>
